[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvar-portfolio"
version = "0.2.0"
description = "CVaR portfolio optimisation with a convex-duality view on the worst-case measure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "cvxpy>=1.4",
    "clarabel>=0.6",
    "yfinance>=0.2.40",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter", "nbconvert", "jinja2>=3.1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
